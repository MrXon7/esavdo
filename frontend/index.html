<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Onlayn Do'kon</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <!-- Top App Header -->
  <header class="app-header">
    <div class="header-top">
      <div class="brand-info">
        <div class="brand-logo" id="brand-logo">🛍</div>
        <div class="brand-name" id="brand-name">Yuklanmoqda...</div>
      </div>
      <div class="header-actions" id="header-admin-action" style="display: none;">
        <a href="/admin/" class="btn-admin-switch">⚙️ Admin</a>
      </div>
    </div>
    <div class="search-bar" id="search-bar-box">
      <input type="text" id="search-input" class="search-input" placeholder="Mahsulotlarni qidirish..." />
    </div>
  </header>

  <!-- View 1: Catalog -->
  <main id="view-catalog" class="view active">
    <!-- Horizontal Categories -->
    <div class="categories-slider" id="categories-slider"></div>

    <!-- Products Grid (2 columns) -->
    <div class="products-container">
      <div class="products-grid" id="products-grid">
        <div class="empty-state" style="grid-column: span 2;">
          <div>Yuklanmoqda...</div>
        </div>
      </div>
    </div>
  </main>

  <!-- View 2: Cart -->
  <section id="view-cart" class="view">
    <div class="cart-items-list" id="cart-items-list"></div>

    <div class="cart-checkout-bar" id="cart-summary-box" style="display: none;">
      <div class="summary-row">
        <span>Jami summa:</span>
        <span id="cart-total-price">0 so'm</span>
      </div>
      <button class="btn-primary" id="btn-go-to-checkout">
        Buyurtma berish
      </button>
    </div>
  </section>

  <!-- View 3: Checkout -->
  <section id="view-checkout" class="view">
    <div class="form-container">
      <h3 style="margin-bottom: 16px;">Yetkazib berish ma'lumotlari</h3>
      <form id="checkout-form">
        <div class="form-group">
          <label class="form-label">Yetkazib berish manzili *</label>
          <textarea id="input-address" class="form-textarea" placeholder="Tuman, ko'cha, uy, xonadon yoki mo'ljal..." required></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Telefon raqamingiz *</label>
          <input type="tel" id="input-phone" class="form-input" placeholder="+998 90 123 45 67" required />
        </div>

        <div class="form-group">
          <label class="form-label">To'lov usuli</label>
          <select id="input-payment-type" class="form-select">
            <option value="cash">Naqd pul orqali (kuryerga)</option>
            <option value="card">Karta orqali (o'tkazma / terminal)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Kuryer uchun izoh (ixtiyoriy)</label>
          <input type="text" id="input-notes" class="form-input" placeholder="Masalan: Domofon kodi 45, eshik oldida qoldiring" />
        </div>

        <button type="submit" class="btn-primary" id="btn-submit-order" style="margin-top: 16px;">
          Buyurtmani tasdiqlash
        </button>
      </form>
    </div>
  </section>

  <!-- View 4: Orders History -->
  <section id="view-orders" class="view">
    <div style="padding: 14px 16px 4px;">
      <h3>Mening buyurtmalarim</h3>
    </div>
    <div class="orders-list" id="orders-list"></div>
  </section>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-view="catalog">
      <span class="nav-icon">🛍</span>
      <span>Katalog</span>
    </button>
    <button class="nav-item" data-view="cart">
      <span class="nav-icon">🛒</span>
      <span>Savat</span>
      <span class="nav-badge" id="cart-count-badge" style="display: none;">0</span>
    </button>
    <button class="nav-item" data-view="orders">
      <span class="nav-icon">📦</span>
      <span>Buyurtmalar</span>
    </button>
  </nav>

  <!-- Product Detail Modal Popup -->
  <div class="modal-overlay" id="product-modal">
    <div class="modal-sheet">
      <div class="modal-close-bar"></div>
      <div class="modal-gallery">
        <img src="" id="modal-img" class="modal-img" alt="Product" />
      </div>
      <h2 class="modal-title" id="modal-title"></h2>
      <div class="modal-price" id="modal-price"></div>
      <div class="modal-desc" id="modal-desc"></div>

      <button class="btn-primary" id="modal-add-btn">
        🛒 Savatga qo'shish
      </button>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
